name: Python platform compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.10'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python -m x518_force --demo --count 2
      - run: uv build --no-sources
      - run: uv venv --python ${{ matrix.python }} wheel-env
      - name: Test installed wheel outside source tree
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          # Preserve the venv path: resolving Python symlinks bypasses the venv on macOS.
          interpreter = pathlib.Path.cwd() / 'wheel-env' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run(['uv', 'pip', 'install', '--python', str(interpreter), str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([str(interpreter), '-m', 'x518_force', '--demo', '--count', '1'], cwd=directory, check=True)
